<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Official Creations — Lead Automation</title>
<link rel="stylesheet" href="frontend/style.css" />

<script src="https://accounts.google.com/gsi/client"></script>
</head>

<body>

  <div class="gate" id="gate">
    <p class="brand">Official Creations</p>

    <p
      class="brand-sub"
      style="margin-bottom:10px;"
    >
      Lead Automation — Control Panel
    </p>

    <p
      class="sub-msg"
      id="gateMsg"
    >
      Sign in with the Google account that has access to the Lead Database sheet.
    </p>

    <button
      class="btn-primary"
      id="signInBtn"
      disabled
    >
      Loading Google Sign-In…
    </button>

    <div class="legal-links">
    <a href="https://officialcreations.online/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
    <span aria-hidden="true">·</span>
    <a href="https://officialcreations.online/terms.html" target="_blank" rel="noopener">Terms of Service</a>
    </div>
  </div>

  <script src="frontend/js/config.js"></script>
  <script src="frontend/js/auth.js"></script>

  <script>
    const params =
      new URLSearchParams(
        window.location.search
      );

    const denied =
      params.get("denied");

    const gateMsg =
      document.getElementById("gateMsg");

    const signInBtn =
      document.getElementById("signInBtn");

    const DENIED_MESSAGES = {
      no_access:
        "This Google account doesn't have access to the Lead Database sheet, so it can't access this dashboard. Ask a teammate to share the sheet with you, then try again.",
      not_on_team:
        "This Google account can open the sheet but hasn't been added to the team yet. Ask the Owner to add your email on the Team tab, then try again.",
    };

    // Extra detail for "not on team": which check failed, and for which email.
    const TEAM_WHY = {
      tab_missing: 'The sheet has no tab named "Team" (check the name and spelling).',
      empty: "The Team tab has no teammates yet.",
      no_email_column: 'The Team tab needs an "Email" header in row 1.',
      no_row: "That email isn't listed on the Team tab.",
    };

    function showDeniedMessage(reason) {
      let message =
        DENIED_MESSAGES[reason] ||
        "Something went wrong signing in. Please try again.";

      const email = params.get("email");
      const why = TEAM_WHY[params.get("why")];

      if (reason === "not_on_team" && email) {
        message += " Signed in as: " + email + "." + (why ? " " + why : "");
      }

      gateMsg.textContent = message;
    }

    function startAuth() {
      if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
      ) {
        gateMsg.textContent =
          "Google Sign-In could not load. Check your internet connection and refresh the page.";

        signInBtn.disabled = true;
        signInBtn.textContent = "Google Sign-In unavailable";
        return;
      }

      signInBtn.disabled = false;
      signInBtn.textContent = "Sign in with Google";

      Auth.init((result) => {
        if (result.ok) {
          window.location.href =
            "frontend/dashboard.html";
        }
      });
    }

    signInBtn.addEventListener(
      "click",
      () => {
        if (
          typeof google !== "undefined" &&
          google.accounts &&
          google.accounts.oauth2
        ) {
          Auth.signIn();
        }
      }
    );

    if (denied) {
      showDeniedMessage(denied);
    }

    if (
      typeof google !== "undefined" &&
      google.accounts &&
      google.accounts.oauth2
    ) {
      startAuth();
    } else {
      window.addEventListener(
        "load",
        startAuth
      );
    }
  </script>

</body>
</html>
